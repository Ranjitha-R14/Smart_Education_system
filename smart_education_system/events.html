<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>College Events</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <h2>Smart Education</h2>

        <a href="student.html">Dashboard</a>

    </nav>


    <main class="page">

        <h1>📅 College Events</h1>

        <input
            type="text"
            id="eventSearch"
            placeholder="Search event..."
            onkeyup="searchEvents()"
        >


        <div id="eventsContainer">

            <div class="event-card">

                <h2>Tech Symposium 2026</h2>

                <p>📅 20 October 2026</p>

                <p>
                    Technical presentations,
                    coding competitions and workshops.
                </p>

                <a href="https://example.com"
                   target="_blank">

                    <button>Apply Now</button>

                </a>

            </div>


            <div class="event-card">

                <h2>Project Expo</h2>

                <p>📅 25 October 2026</p>

                <p>
                    Showcase your innovative projects.
                </p>

                <a href="https://example.com"
                   target="_blank">

                    <button>Apply Now</button>

                </a>

            </div>


            <div class="event-card">

                <h2>Placement Training</h2>

                <p>📅 30 October 2026</p>

                <p>
                    Training program for placement preparation.
                </p>

                <a href="https://example.com"
                   target="_blank">

                    <button>Apply Now</button>

                </a>

            </div>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
