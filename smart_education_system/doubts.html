<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Anonymous Doubts</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <h2>Smart Education</h2>

        <a href="student.html">Dashboard</a>

    </nav>


    <main class="page">

        <h1>💬 Anonymous Doubt</h1>

        <p>
            Don't worry. Your name will not be shown.
        </p>


        <div class="doubt-card">

            <label>Select Subject</label>

            <select id="subject">

                <option>Digital Signal Processing</option>
                <option>Computer Networks</option>
                <option>Microcontrollers</option>
                <option>Digital Electronics</option>
                <option>Engineering Mathematics</option>

            </select>


            <label>Select Topic</label>

            <input
                type="text"
                id="topic"
                placeholder="Example: Sampling theorem"
            >


            <label>Your Doubt</label>

            <textarea
                id="doubt"
                placeholder="Tell us what you didn't understand..."
            ></textarea>


            <button onclick="submitDoubt()">
                I Didn't Understand
            </button>


            <p id="doubtMessage"></p>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
