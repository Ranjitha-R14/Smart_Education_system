<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <title>Private Counseling</title>

    <link rel="stylesheet" href="css/style.css">

</head>

<body>

    <nav class="navbar">

        <h2>Smart Education</h2>

        <a href="student.html">Dashboard</a>

    </nav>


    <main class="page">

        <h1>🧑‍🏫 Private Counseling</h1>

        <p>
            Send a private message to your counselor.
        </p>


        <div class="counsel-card">

            <label>Message</label>

            <textarea
                id="counselMessage"
                placeholder="Write your message here..."
            ></textarea>


            <button onclick="sendCounselingMessage()">
                Send Privately
            </button>


            <p id="counselStatus"></p>

        </div>

    </main>


    <script src="js/app.js"></script>

</body>
</html>
