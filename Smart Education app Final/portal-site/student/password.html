<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Change password | Smart Education Portal</title>
<link rel="stylesheet" href="../css/style.css">
<link rel="manifest" href="../manifest.webmanifest">
<meta name="theme-color" content="#1d4ed8">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="EduPortal">
<link rel="apple-touch-icon" href="../images/apple-touch-icon.png">
<link rel="icon" type="image/png" href="../images/icon-192.png">
</head>
<body>
<div id="shell"></div>
<main class="page">
  <h1>Change password</h1>
  <p class="lead">Choose a password only you know. Use at least 8 characters with letters and numbers.</p>

  <section class="panel" style="max-width:480px">
    <form id="pwForm" autocomplete="off">
      <label for="oldPw">Current password</label>
      <input id="oldPw" type="password" required>
      <label for="newPw">New password</label>
      <input id="newPw" type="password" required>
      <label for="confirmPw">Type the new password again</label>
      <input id="confirmPw" type="password" required>
      <label style="font-weight:400; margin-top:14px"><input id="showPw" type="checkbox" style="width:auto; margin-right:8px"> Show passwords</label>
      <button class="btn" type="submit" style="margin-top:16px">Change password</button>
      <p id="pwStatus" class="status" role="status"></p>
    </form>
  </section>
  <p class="muted">Demo note: in this prototype the new password is saved in this browser only. The real version uses Supabase login.</p>
</main>

<script src="../js/app.js"></script>
<script>
  const user = requireRole("student");
  if (user) renderStudentShell(user, "password");

  document.getElementById("showPw").addEventListener("change", (e) => {
    ["oldPw", "newPw", "confirmPw"].forEach(id => { document.getElementById(id).type = e.target.checked ? "text" : "password"; });
  });

  document.getElementById("pwForm").addEventListener("submit", (e) => {
    e.preventDefault();
    const result = changePassword(user, document.getElementById("oldPw").value,
      document.getElementById("newPw").value, document.getElementById("confirmPw").value);
    const status = document.getElementById("pwStatus");
    status.className = "status " + (result.ok ? "ok" : "err");
    status.textContent = result.message;
    if (result.ok) e.target.reset();
  });
</script>
<script src="../js/pwa.js"></script>
</body>
</html>
